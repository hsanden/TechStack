name: Skanna och publicera

on:
  schedule:
    - cron: '17 3 * * 1' # måndagar 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'data/sites.json', 'data/overrides.json']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Skanna (bara schemalagt eller manuellt)
        if: github.event_name != 'push'
        run: npm run scan
      - name: Spara resultat
        if: github.event_name != 'push'
        run: |
          git config user.name "techstack-bot"
          git config user.email "techstack-bot@users.noreply.github.com"
          git add data/results.json data/changes.json
          git diff --cached --quiet || git commit -m "Skanning $(date -u +%F)"
          git push
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
